name: Deploy to cPanel

on:
  push:
    branches:
      - main # Akan jalan setiap push ke branch main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Copy Static Files to Standalone
        # Standalone butuh folder public dan .next/static disalin manual
        run: |
          cp -r public .next/standalone/ || true
          cp -r .next/static .next/standalone/.next/ || true

      - name: Upload to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: .next/standalone/
          # Jangan ubah server-dir jika Anda sudah membatasi folder FTP di cPanel ke /pakdegriya-app
          server-dir: /